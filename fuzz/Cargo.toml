# Fuzz targets (cargo-fuzz layout; design section 11): run with `cargo fuzz run <target>` on a
# nightly toolchain. Its own workspace, so the main workspace never builds libFuzzer.
[package]
name = "ooxml-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ooxml-base = { path = "../crates/ooxml-base" }
ooxml-xml = { path = "../crates/ooxml-xml" }
ooxml-zip = { path = "../crates/ooxml-zip" }
ooxml-opc = { path = "../crates/ooxml-opc" }
ooxml-metafile = { path = "../crates/ooxml-metafile" }
ooxml-colour = { path = "../crates/ooxml-colour" }
ooxml-drawingml = { path = "../crates/ooxml-drawingml" }
ooxml-numfmt = { path = "../crates/ooxml-numfmt" }
ooxml-chart = { path = "../crates/ooxml-chart" }
ooxml-render = { path = "../crates/ooxml-render" }
ooxml-fonts = { path = "../crates/ooxml-fonts" }
ooxml-word-layout = { path = "../crates/ooxml-word-layout" }
ooxml-word-pages = { path = "../crates/ooxml-word-pages" }

[workspace]

[[bin]]
name = "xml_roundtrip"
path = "fuzz_targets/xml_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "zip_read"
path = "fuzz_targets/zip_read.rs"
test = false
doc = false
bench = false

[[bin]]
name = "opc_open"
path = "fuzz_targets/opc_open.rs"
test = false
doc = false
bench = false

[[bin]]
name = "metafile_draw"
path = "fuzz_targets/metafile_draw.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chart_layout"
path = "fuzz_targets/chart_layout.rs"
test = false
doc = false
bench = false

[[bin]]
name = "drawing_render"
path = "fuzz_targets/drawing_render.rs"
test = false
doc = false
bench = false

[[bin]]
name = "vml_paint"
path = "fuzz_targets/vml_paint.rs"
test = false
doc = false
bench = false

[[bin]]
name = "glyph_ink"
path = "fuzz_targets/glyph_ink.rs"
test = false
doc = false
bench = false
