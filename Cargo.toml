[workspace]
members = ["crates/core", "crates/word", "crates/python"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/uvrt/ooxml"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
num-rational = { version = "0.4", default-features = false, features = ["std"] }
num-integer = "0.1"
num-traits = "0.2"
pyo3 = "0.30"

[profile.release]
opt-level = 3
debug = false
codegen-units = 4
