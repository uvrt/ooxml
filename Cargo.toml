[workspace]
members = [
    "crates/python",
    "crates/ooxml-base",
    "crates/ooxml-xml",
    "crates/ooxml-zip",
    "crates/ooxml-opc",
    "crates/ooxml-store",
    "crates/ooxml-derive",
    "crates/ooxml-fonts",
    "crates/ooxml-text",
    "crates/ooxml-word-model",
    "crates/ooxml-word-layout",
    "crates/ooxml-word-edit",
    "crates/ooxml-oracle",
    "crates/ooxml-schema",
    "crates/ooxml-colour",
    "crates/ooxml-drawingml",
    "crates/ooxml-numfmt",
    "crates/ooxml-style-names",
    "crates/ooxml-markdown",
    "crates/ooxml-sheets",
    "crates/ooxml-chart",
    "crates/ooxml-tools-derive",
    "crates/ooxml-tools",
    "crates/ooxml-tools-chart",
    "crates/ooxml-tools-word",
    "crates/ooxml-session",
    "crates/ooxml-session-word",
    "crates/ooxml-host",
    "crates/ooxml-python-session",
    "crates/ooxml-scene",
    "crates/ooxml-metafile",
    "crates/ooxml-render",
    "crates/ooxml-raster",
    "crates/ooxml-word-pages",
    "xtask",
]
# cargo-fuzz's layout: its own workspace, built with `cargo fuzz` (nightly).
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/uvrt/ooxml"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
num-rational = { version = "0.4", default-features = false, features = ["std"] }
num-integer = "0.1"
num-traits = "0.2"
pyo3 = "0.30"
thiserror = "2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
arc-swap = "1"
loom = "0.7"
fancy-regex = "0.14"
# NFKC, as Python's unicodedata folds names (DEPENDENCIES.md; approved 2026-11-21).
unicode-normalization = "=0.1.26"
ooxml-base = { path = "crates/ooxml-base" }
ooxml-xml = { path = "crates/ooxml-xml" }
ooxml-zip = { path = "crates/ooxml-zip" }
ooxml-opc = { path = "crates/ooxml-opc" }
ooxml-derive = { path = "crates/ooxml-derive" }
ooxml-fonts = { path = "crates/ooxml-fonts" }
ooxml-text = { path = "crates/ooxml-text" }
ooxml-word-model = { path = "crates/ooxml-word-model" }
ooxml-word-layout = { path = "crates/ooxml-word-layout" }
ooxml-word-edit = { path = "crates/ooxml-word-edit" }
ooxml-schema = { path = "crates/ooxml-schema" }
ooxml-colour = { path = "crates/ooxml-colour" }
ooxml-drawingml = { path = "crates/ooxml-drawingml" }
ooxml-scene = { path = "crates/ooxml-scene" }
ooxml-metafile = { path = "crates/ooxml-metafile" }
ooxml-render = { path = "crates/ooxml-render" }
ooxml-raster = { path = "crates/ooxml-raster" }
ooxml-word-pages = { path = "crates/ooxml-word-pages" }
ooxml-numfmt = { path = "crates/ooxml-numfmt" }
ooxml-style-names = { path = "crates/ooxml-style-names" }
ooxml-markdown = { path = "crates/ooxml-markdown" }
ooxml-chart = { path = "crates/ooxml-chart" }
ooxml-sheets = { path = "crates/ooxml-sheets" }
ooxml-tools-derive = { path = "crates/ooxml-tools-derive" }
ooxml-tools = { path = "crates/ooxml-tools" }
ooxml-tools-chart = { path = "crates/ooxml-tools-chart" }
ooxml-tools-word = { path = "crates/ooxml-tools-word" }
ooxml-store = { path = "crates/ooxml-store" }
ooxml-session = { path = "crates/ooxml-session" }
ooxml-session-word = { path = "crates/ooxml-session-word" }
ooxml-host = { path = "crates/ooxml-host" }
ooxml-python-session = { path = "crates/ooxml-python-session" }
read-fonts = { version = "0.47", default-features = false, features = ["std"] }
# The versions resvg-py 0.5.0 links (its Cargo.lock), exactly, so a PNG drawn here is the
# PNG Python draws (decision 7; DEPENDENCIES.md).  resvg-py's features less `svgz` (an SVG
# reaches the rasteriser as text, never gzipped).
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
usvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
fontdb = { version = "=0.24.0", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd", "png-format"] }

# The architecture's standards (docs/architecture/README.md, section 2), for every crate that
# says `[lints] workspace = true` -- the new crates; the prototype crates (core, word, python)
# keep their own until they are replaced.  Tests may unwrap (clippy.toml).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# ooxml-store's commit path is model-checked with loom: `RUSTFLAGS="--cfg loom"`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "deny"

[profile.release]
opt-level = 3
debug = false
codegen-units = 4
