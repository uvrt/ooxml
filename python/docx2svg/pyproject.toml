[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx2svg"
version = "0.15.0"
description = "Render Word (.docx) documents to SVG and PNG, laid out and drawn by the Rust core (ooxml-core)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Evert Koks" }]
keywords = ["docx", "word", "svg", "ooxml", "render", "pagination"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Free Threading :: 2 - Beta",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Office/Business :: Office Suites",
  "Typing :: Typed",
]
# The Rust core lays documents out and draws them (ooxml-core); ooxml-common reads the font
# folders and writes text as outlines.  Why each, and at its version: CONTRIBUTING.md,
# "Dependencies".
dependencies = ["ooxml-common>=0.45.1", "ooxml-core>=0.11.0"]

[project.optional-dependencies]
# PNG is drawn by ooxml-core now: the extra needs nothing.  Kept for one release, so that
# `pip install docx2svg[png]` still installs; then removed.
png = []
dev = [
  "pytest>=7",
  # `pytest -n auto` (docs/development.md).  Opt-in: a bare `pytest` stays serial,
  # and so does CI.
  "pytest-xdist>=3",
  # The linter (CI's build job runs it, at the same pin; [tool.ruff] below).
  "ruff==0.17.2",
  # The type checker (CI's build job runs it, at the same pin; [tool.mypy] below).
  "mypy==2.4.0",
]

[project.scripts]
docx2svg = "docx2svg.cli:main"

[project.urls]
Repository = "https://github.com/uvrt/docx2svg"
Changelog = "https://github.com/uvrt/docx2svg/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/uvrt/docx2svg/blob/main/ROADMAP.md"

[tool.setuptools.packages.find]
where = ["src"]

# py.typed, so a caller's type checker reads the package's annotations (PEP 561).
[tool.setuptools.package-data]
docx2svg = ["py.typed"]

# A small set of bug-finding rules, not a style: pyflakes (F), syntax errors (E9),
# mutable or called defaults (B006, B008), return in finally (B012), comparisons that do
# nothing (B015) and pylint's errors (PLE).  No formatter and no import sorting.
[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["F", "E9", "B006", "B008", "B012", "B015", "PLE"]

# `mypy` (CI's build job): the package, not strict -- the annotations as written are
# checked, an unannotated function's body is not.
[tool.mypy]
python_version = "3.10"
files = ["src/docx2svg"]
mypy_path = "src"
disable_error_code = ["annotation-unchecked"]

[tool.pytest.ini_options]
testpaths = ["tests"]
