[package]
name = "ooxml-python"
version = "0.10.0"
description = "The Python module ooxml_core (PyO3): documents' owners by id, and Word's layout"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The extension module's file is named by maturin (module-name in
# python/ooxml-core/pyproject.toml); this name only keeps it apart from the ooxml-core crate.
name = "ooxml_core_py"
crate-type = ["cdylib"]
# An extension module leaves the interpreter's symbols unresolved, so a test binary of it
# cannot link on Linux; python/ooxml-core/tests tests the module.
test = false
doctest = false

[dependencies]
ooxml-core = { path = "../core" }
ooxml-word = { path = "../word" }
# Lane P0d: the session API (ooxml_core.Session, CancelToken, tool_specs), added to this
# module so that one native module ships until ooxml-python-session replaces this crate.
ooxml-python-session.workspace = true
pyo3 = { workspace = true, features = ["extension-module"] }
serde_json.workspace = true
# Lane J: the digests of a tree's parts (tree.rs); already in the lock through hashbrown.
foldhash = "0.2"
rayon.workspace = true

[features]
# The stable ABI from 3.10: one wheel for every GIL build of CPython 3.10 and later.  Left
# off for the free-threaded build, which gets a wheel of its own.
abi3 = ["pyo3/abi3-py310"]
