# Known differences between docx-agent and the Rust core in the heavy gates
# (tools/gates.py, .github/workflows/gates.yml).  A gate fails on any case with differences
# that no entry here covers.  An entry covers a case when its `mode` is the case's, and each of
# the keys it gives matches:
#   gate   fixtures, corpus or reads (any gate when left out);
#   file   a glob on the document's path below the gate's tree (any document when left out);
#   input  a subset of the case's input as the harness made it (word_edits_diff.py's case);
#   document  a condition on the case's document: { lacks_namespace = URI } -- the root of
#          word/document.xml (or of `part` when given) does not declare that namespace.
# A case's number within its document is no key: it changes with the run's sampling
# (per_tool, every) and with every case maker added, so an entry names the case by its input.
# `cause` says why the difference is intended; an entry without one is refused.  Add an entry
# only for a difference that is understood and meant, citing the pull request that found it.

# #89: Markdown that is only a comment, untracked and tracked (28 cases on the fixtures).
[[difference]]
mode = "markdown"
input = { op = "insert_markdown", markdown = "<!-- only a comment -->\n" }
cause = """#89: docx-agent rolls the tree back, but its id pool and aliases keep what the stamping \
drew; the Rust core changes nothing (tool rule 3: a no-op changes nothing). A docx-agent \
leftover, not copied."""

# Lane P2c12: the same as #89 through the tool -- Markdown that writes nothing (empty, or only a
# comment).
[[difference]]
mode = "text"
input = { tool = "word_insert_markdown", arguments = { markdown = "" } }
cause = """#89 through word_insert_markdown: docx-agent rolls the tree back, but its id pool and \
aliases keep what the stamping drew; the Rust core changes nothing (tool rule 3: a no-op changes \
nothing). A docx-agent leftover, not copied."""

[[difference]]
mode = "text"
input = { tool = "word_insert_markdown", arguments = { markdown = "<!-- only a comment -->\n" } }
cause = """#89 through word_insert_markdown: docx-agent rolls the tree back, but its id pool and \
aliases keep what the stamping drew; the Rust core changes nothing (tool rule 3: a no-op changes \
nothing). A docx-agent leftover, not copied."""

# #84: a SEQ field inserted in the document's text box, untracked and tracked (lane P4b8: by
# input, not by case number).
[[difference]]
gate = "fixtures"
mode = "structure"
file = "generated/charts/chart-places.docx"
input = { tool = "word_fields", arguments = { action = "insert_field", at = "p@body/2@0", instruction = "SEQ Figure \\* ARABIC" } }
cause = """#84: docx-agent's _write_result takes as the old result only runs with no w:r ancestor; \
in a text box every run has one, so it writes the value as a new run beside the empty result run. \
Rust writes the value into the result run, as docx-agent does everywhere outside a text box."""

# Lane P5s (#240): page numbers inserted in chart-places' text box (at, after, before its first
# paragraph), untracked and tracked: both write the result now (the Rust layout lays the box out,
# lane P5n); docx-agent writes it as #84's SEQ above.
[[difference]]
gate = "fixtures"
mode = "structure"
file = "generated/charts/chart-places.docx"
input = { tool = "word_fields", arguments = { action = "insert_field", at = "p@body/2@2", instruction = "PAGE" } }
cause = """#240 as #84: in a text box docx-agent's _write_result finds no old result run (every run \
has a w:r ancestor) and writes the value as a new run beside the empty result run; Rust writes \
the value into the result run, as docx-agent does outside a text box. Same value (Word's: the \
page the box is drawn on); Word sees no difference but the empty run."""

