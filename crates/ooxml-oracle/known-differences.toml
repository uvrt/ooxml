# Lane P4f7: an untracked copy at replace: of blocks the document never stamped (positional
# addresses), in a document whose stamping gives them ids first (chart-places: 2 cases).
[[difference]]
mode = "structure"
input = { tool = "word_copy_from", replaces_unstamped = true }
cause = """Lane P4f7: docx-agent's copy_blocks reads the ids the document had (_known_ids) before \
_prepare stamps it, so a paraId or drawing id its stamping gave a replaced block, deleted before \
the copy is stamped, is given again to the copy (the id is both removed and created). The Rust \
core never gives an id twice (the ledger's rule); its copy takes the next id. A docx-agent \
leftover, not copied."""

# Lane P2c15 (found in #146, lane P2c14): declared table styles in Word's Dark List and Colorful
# List families (and their accents), where a case pages that far.
[[difference]]
mode = "style"
input = { tool = "word_design_facts", arguments = { include = ["declared_styles"] } }
cause = """#146: the Rust tool names the theme colour of a band cell's edge drawn by a \
neighbouring place's border (the header row's bottom, w:themeColor="background1": \
"single 2.25pt FFFFFF (background1)"); docx-agent labels only the colours of the place's own \
conditions and leaves the label out. Every other value is the same. Rust's answer is the \
accurate one; docx-agent's code is deleted at P4e (test_declared_styles asserts Rust's values)."""

[[difference]]
mode = "style"
input = { tool = "word_design_facts", arguments = { include = ["theme", "declared_styles"] } }
cause = """#146: as above -- the Rust tool names the theme colour (background1) of a band \
cell's edge drawn by a neighbouring place's border; docx-agent leaves the label out. Rust's \
answer is the accurate one; docx-agent's code is deleted at P4e."""

# Lane E3: a tracked delete_row past the last row of a table holding a pending tracked merge.
[[difference]]
mode = "objects"
file = "generated/tables-accepted.docx"
input = { tool = "word_edit_table", tracked = { author = "Writer A" }, arguments = { action = "delete_row", index = 99 } }
cause = """Lane E3: docx-agent's _no_reshape_over_merge_lead reads rows[index] unchecked while looking \
for a pending tracked merge's first cell and fails with Python's IndexError ('list index out of \
range', not_found); the Rust core refuses the row as docx-agent's delete_row does untracked \
('t:... has no row 99', refused). A docx-agent crash, not copied."""

