paragraphs (tr:5B0000B0, p:5B0000AE, p:5B0000AF), none of which the document has after the edit; \
docx-agent's delete_block names a gone row's paragraphs by id() of their lxml proxies taken \
before the deletion, and the detached row's paragraphs come back as new proxies, so only the row \
