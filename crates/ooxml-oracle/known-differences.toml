# Known differences between docx-agent and the Rust core in the heavy gates
# (tools/gates.py, .github/workflows/gates.yml).  A gate fails on any case with differences
# that no entry here covers.  An entry covers a case when its `mode` is the case's, and each of
# the keys it gives matches:
#   gate   fixtures, corpus or reads (any gate when left out);
#   file   a glob on the document's path below the gate's tree (any document when left out);
#   input  a subset of the case's input as the harness made it (word_edits_diff.py's case);
#   case   the case's number within its document.
# `cause` says why the difference is intended; an entry without one is refused.  Add an entry
# only for a difference that is understood and meant, citing the pull request that found it.

# #89: Markdown that is only a comment, untracked and tracked (28 cases on the fixtures).
[[difference]]
mode = "markdown"
input = { op = "insert_markdown", markdown = "<!-- only a comment -->\n" }
cause = """#89: docx-agent rolls the tree back, but its id pool and aliases keep what the stamping \
drew; the Rust core changes nothing (tool rule 3: a no-op changes nothing). A docx-agent \
leftover, not copied."""

# #84: a SEQ field inserted in the document's text box: case 173 untracked, 198 tracked.
[[difference]]
gate = "fixtures"
mode = "structure"
file = "generated/charts/chart-places.docx"
case = 173
input = { tool = "word_fields", arguments = { action = "insert_field", instruction = "SEQ Figure \\* ARABIC" } }
cause = """#84: docx-agent's _write_result takes as the old result only runs with no w:r ancestor; \
in a text box every run has one, so it writes the value as a new run beside the empty result run. \
Rust writes the value into the result run, as docx-agent does everywhere outside a text box."""

[[difference]]
gate = "fixtures"
mode = "structure"
file = "generated/charts/chart-places.docx"
case = 198
input = { tool = "word_fields", arguments = { action = "insert_field", instruction = "SEQ Figure \\* ARABIC" } }
cause = """#84: docx-agent's _write_result takes as the old result only runs with no w:r ancestor; \
in a text box every run has one, so it writes the value as a new run beside the empty result run. \
Rust writes the value into the result run, as docx-agent does everywhere outside a text box."""

# #84: a fields update that changes nothing, on a template saved as .docx: case 140 all
# fields, 142 the footer's.
[[difference]]
gate = "fixtures"
mode = "structure"
file = "generated/trial/template-saved-as-docx.docx"
case = 140
input = { tool = "word_fields", arguments = { action = "update" } }
cause = """#84: docx-agent's session adds its TemplateOpened warning (the host's, not the tool's) \
to an update that changes nothing."""

[[difference]]
gate = "fixtures"
mode = "structure"
file = "generated/trial/template-saved-as-docx.docx"
case = 142
input = { tool = "word_fields", arguments = { action = "update", ids = ["fld:footer1/0"] } }
cause = """#84: docx-agent's session adds its TemplateOpened warning (the host's, not the tool's) \
to an update that changes nothing."""

# word_read (and its ranges) on the documents with charts and SmartArt: the Rust reads give a
# drawing's kind and name, not yet docx-agent's chart and SmartArt summary.
[[difference]]
gate = "reads"
mode = "read"
file = "generated/charts/*.docx"
cause = """Phase P3 (the chart model): docx_agent.rust.session's reads are equal to docx-agent's on \
every fixture but drawings' chart and SmartArt summaries (tests/test_rust_word_read.py)."""

[[difference]]
gate = "reads"
mode = "ranges"
file = "generated/charts/*.docx"
cause = """Phase P3 (the chart model): word_read of a range holding a chart or SmartArt, as for \
mode read above."""

# word_controls insert at a position past its paragraph's text, untracked and tracked (one per
# document with a paragraph; the case's tag marks it).
[[difference]]
mode = "objects"
input = { tool = "word_controls", arguments = { action = "insert", tag = "past the text" } }
cause = """docx-agent's insert_control takes the position unchecked and fails inside new_run with \
Python's IndexError ('list index out of range', not_found); the Rust core refuses the position, \
saying how many characters the paragraph has (as word_notes refuses one). A docx-agent crash, \
not copied."""

# P4c10: word_drawings float and inline of a frame in a part whose root does not declare
# the wordprocessingDrawing namespace (docx-agent's own Markdown writer declares it on each
# frame): 10 cases a fixture, untracked and tracked.
[[difference]]
mode = "objects"
file = "generated/markdown/constructs.docx"
input = { tool = "word_drawings", arguments = { action = "float" } }
cause = """P4c10: docx-agent makes the new wp:anchor or wp:inline detached, so lxml names its \
namespace ns0 (and wp14 ns1) and the frame's children ns0:...; the Rust core keeps the \
frame's own declarations of wp and wp14 on the new frame, so it and its children keep wp:. \
Both are the same XML; Word reads either."""

[[difference]]
mode = "objects"
file = "generated/markdown/constructs.docx"
input = { tool = "word_drawings", arguments = { action = "inline" } }
cause = """P4c10: as the float entry above: docx-agent's ns0/ns1 prefixes on the new wp:inline."""

[[difference]]
mode = "objects"
file = "generated/lists-and-styles.docx"
input = { tool = "word_drawings", arguments = { action = "float" } }
cause = """P4c10: as the constructs.docx float entry above: docx-agent's ns0 prefix on the new wp:anchor."""

