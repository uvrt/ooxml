# P4c10: a set that leaves the frame as it was (square wrapping on a frame wrapped square,
# one step back or forward with no drawing there) in a fixture lxml did not write.
[[difference]]
mode = "objects"
file = "generated/markdown/constructs.docx"
input = { tool = "word_drawings", arguments = { action = "set", wrap = "square" } }
cause = """P4c10: the frame is as it was; docx-agent writes the part again as lxml writes it \
(constructs.docx was not written by lxml), and touched names the heading sections whose \
frames lxml writes again; the Rust core's touched names the part only (no block changed)."""

[[difference]]
mode = "objects"
file = "generated/markdown/constructs.docx"
input = { tool = "word_drawings", arguments = { action = "set", z_order = "backward" } }
cause = """P4c10: as the set wrap square entry above: no drawing below, the frame keeps its order."""

