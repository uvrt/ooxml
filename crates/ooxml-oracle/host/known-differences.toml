# Known differences between the host goldens (today's Python host, recorded) and the host that
# replays them (crates/ooxml-oracle/python/host_goldens.py; tests/test_host_goldens.py now, the
# Rust host's replayer later).  A replayed case fails on any difference no entry here admits.
#
# An entry admits the differences in its `fields` -- paths into an event, as the replay names
# them (`result.warnings`, `result.error`, `results[2].data`; a path admits everything below it)
# -- of the events it matches:
#   stream     a glob on the stream's name (`docx/tests/test_tool_errors`; any when left out);
#   case       a glob on the case's id (`test_x::test_y#1`; any when left out);
#   tool       the call's tool (any when left out);
#   at         the event's number within its case (any when left out);
#   arguments  a subset of the call's arguments.
# Every entry gives its `rule` -- the tool design rule that makes the new answer the right one;
# only rule 1 (accept intent: one acceptance, Rust's, decision D4 of the Phase 3 design) -- or
# its `decision` -- a user decision whose new answer it is; only
# "structured-problems-2026-11-25" (one problems shape in every reply: an edit's
# checks.validate gives the problems it added and fixed as {code, part, element, message,
# severity}) or "optimistic-batches-2026-11-25" (a batch on one document runs optimistically,
# holding nothing, and run again where it conflicts: what it says of itself says so) -- and its `cause`, citing the pull request that changed the answer.  An entry
# without a cause, or without an allowed rule or decision, is refused.  Each entry is also a
# release-notes line.  The Rust replayer (crates/ooxml-oracle/src/host_replay.rs) reads this
# file's subset: `[[difference]]` tables of strings, integers and lists of strings.

[[difference]]
decision = "structured-problems-2026-11-25"
fields = ["result.checks.validate.new", "result.checks.validate.fixed"]
cause = "Phase 3 D1b (ooxml-host): an edit's checks.validate says each problem it added or fixed as {code, part, element, message, severity}, element the problem's detail and message today's text"

[[difference]]
decision = "structured-problems-2026-11-25"
tool = "check"
fields = ["result.data.validate.new", "result.data.validate.fixed", "result.data.validate.problems", "result.data.validate.warnings", "result.data.validation.new", "result.data.validation.fixed"]
cause = "Phase 3 E1a (ooxml-tools-word, ooxml-host): check's validate (new, fixed, problems, warnings) and validation (new, fixed) say each problem as {code, part, element, message, severity}, element the problem's detail and message today's text; a warning (what Word repairs the same way each time) has severity warning"

[[difference]]
decision = "structured-problems-2026-11-25"
tool = "save_document"
fields = ["result.error.details.validate.new", "result.error.details.validate.fixed", "result.data.validate.new", "result.data.validate.fixed"]
cause = "Phase 3 E1a (ooxml-host): a save the gate refuses says what blocked it in details.validate, and a save's validate says the problems, each as {code, part, element, message, severity}; valid_options still lists each new problem by its words"

[[difference]]
decision = "optimistic-batches-2026-11-25"
tool = "batch"
case = "test_session_checks::test_a_check_between_a_batch_s_changes_holds_the_document_and_says_so#*"
fields = ["result.warnings"]
cause = "Phase 3 D2c (ooxml-host, ooxml-session-word): a check that lays the document out between the changes of a batch on one document says \"check laid the document out between the batch's changes, and lays it out again each time the batch runs again. Put check after the batch's last change (or call it alone)\": the batch holds nothing, so no other call waits for it (a batch over several documents, or one run behind the gate, still says it held the document and others waited)"

[[difference]]
decision = "optimistic-batches-2026-11-25"
tool = "batch"
case = "test_check_timing::test_a_check_in_a_batch_lays_out_there#*"
fields = ["result.warnings"]
cause = "Phase 3 D2c (ooxml-host, ooxml-session-word): as above, a check between the changes of an optimistic batch on one document"

[[difference]]
rule = 1
fields = ["result.error.try_call"]
cause = "Phase 3 C1 (#405), C2 (#408) and D1 (ooxml-host): a refusal that today offered no options carries the call that would be made again (rule 2's way out; one acceptance, Rust's)"


[[difference]]
rule = 1
stream = "docx/tests/test_places"
fields = ["result.error"]
cause = "Phase 3 D1 (ooxml-host, decision D4): a place written in another placing tool's words (before, where) is taken or refused by the tool's own acceptance (Rust's places), in its words; today's Python check ran first"

[[difference]]
rule = 1
tool = "undo"
fields = ["result.error", "result.doc", "result.version"]
cause = "Phase 3 D1 (ooxml-host, decision D4): undo's scope (decks' and workbooks' only) is refused by Rust's acceptance as an argument a document's undo does not take, before the document is read"

[[difference]]
rule = 1
tool = "word_compare_blocks"
fields = ["result.error.field"]
cause = "Phase 3 D1 (ooxml-host, decision D4): a document named in a nested argument that is not open is refused at that argument (reference.doc), as Rust's acceptance names it"

[[difference]]
rule = 1
tool = "check"
fields = ["result.error.field"]
cause = "Phase 3 D1 (ooxml-host, decision D4): a document named in a nested argument that is not open is refused at that argument (copies[].reference.doc), as Rust's acceptance names it"

# Today's Python host names the first unknown argument in a set's order, which the process's hash
# seed decides: `word_style` (read as word_styles) with both `style` and `targets` unknown names
# either.  The Rust host names them in the call's order (tool design rule 1: the refusal says
# plainly which argument it did not take; the same call gets the same answer).
[[difference]]
stream = "docx/features/names"
case = "features/names::unknown_arguments_named#*"
tool = "word_style"
fields = ["result.error.field", "result.error.message"]
rule = 1
cause = """Hash-seed order: Python's set of unknown arguments decides which one a refusal names; the \
Rust host names the first in the call's order (ph3-diff F2, found by F1 #396)."""

