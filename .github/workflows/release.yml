name: Release

# Prebuilt packages on GitHub Releases (not PyPI).  A tag `v<YYYY>.<MM>.<DD>` -- with
# `.<N>` for a second release the same day -- builds the sdists and wheels of every
# distribution in this repository (the seven packages and pptx2svg's font bundle, each at
# the version its pyproject.toml names), checks that they install from one page as the
# README says, and attaches them to the GitHub Release of that tag, with notes listing
# each distribution and its version (tools/release_notes.py).
#
# A manual run (workflow_dispatch, on any branch: `gh workflow run release.yml --ref
# <branch>`) and a pull request that changes this file or the scripts it runs do everything
# but the release: they build, check and upload the files as the run's artifacts.
#
# Every run rebuilds from a clean checkout of the tagged commit, so what ships is exactly
# what that source produces.
#
# The package index: after the release, the `pages` job publishes a PEP 503 simple index of
# every release so far to GitHub Pages (https://uvrt.github.io/ooxml/simple/, for
# `pip install --extra-index-url`; tools/simple_index.py).  Its links point at the release
# assets.  Every run (pull requests and manual runs too) builds the index of the run's own
# files and installs from it on Python 3.15 as a check, without deploying.

on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]", "v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9].*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - tools/release_notes.py
      - tools/check_release_install.sh
      - tools/simple_index.py
      - .github/workflows/rust-wheels.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: build (python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pure Python: one wheel and one sdist each.
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          for d in ooxml-common ooxml-edit docx2svg pptx2svg pptx2svg/packages/pptx2svg-fonts docx-agent pptx-agent xlsx-agent; do
            python -m build --outdir dist "python/$d"
          done
          python -m twine check dist/*
          ls -l dist

      # Kept from pptx2svg's own release workflow: the wheel installs and works.
      - name: The pptx2svg wheel installs and works
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --find-links dist "pptx2svg[png]"
          cd /tmp
          /tmp/verify/bin/python -c "
          import pptx2svg
          print('version', pptx2svg.__version__)
          print('backends', pptx2svg.available_backends())
          "
          /tmp/verify/bin/pptx2svg --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist-python
          path: dist/

  # ooxml-core: every target, as on main.
  rust:
    name: build (ooxml-core)
    uses: ./.github/workflows/rust-wheels.yml
    with:
      full: true

  # The files of every build job, gathered; then the install the README gives, from a local
  # page that lists them as the release page will.
  check:
    name: check the install
    needs: [python, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/
      - name: Every distribution has its files
        run: python tools/release_notes.py check-only dist > /dev/null
      - name: pip install --find-links <page> resolves the packages from it
        run: bash tools/check_release_install.sh dist
      - name: Release notes
        run: |
          python tools/release_notes.py "${GITHUB_REF_NAME}" dist | tee notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            notes.md

  release:
    name: release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, index]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: .
      - name: Create the release with its files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag dist/*

  # The install the README gives from the package index, on the Python production runs:
  # the index of this run's files (tools/simple_index.py dist), served locally as Pages
  # serves it, and `pip install --extra-index-url <index> <package>` with no version.
  index:
    name: check the index install
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: .
      - name: pip install --extra-index-url <index> resolves the newest packages from it
        run: bash tools/check_release_install.sh --index dist

  # The index of every release so far, deployed to GitHub Pages.  Tag pushes only, after the
  # release exists (its assets and their digests come from the GitHub API).  Requires
  # Pages enabled with source "GitHub Actions", and the github-pages environment allowing
  # deployments from the release tags.
  pages:
    name: package index (GitHub Pages)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [release, index]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}simple/
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: .
      # Requires-Python of the files the last deploy listed comes from its files.json, of
      # this release's files from dist/; anything else is read from the file itself.
      - name: Build the index of every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          python tools/simple_index.py releases site --repo "$GITHUB_REPOSITORY" --local dist \
            --previous "https://$owner.github.io/${GITHUB_REPOSITORY#*/}/files.json"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
