name: Gates

# The heavy gates a lane runs before its pull request is done, on GitHub's Linux runners and on
# demand only (never on push, not a required check):
#   gh workflow run gates.yml --repo uvrt/ooxml -f ref=<branch> -f gates=fixtures,corpus,seeds
#   gh run watch --repo uvrt/ooxml $(gh run list --repo uvrt/ooxml --workflow gates.yml --limit 1 --json databaseId -q '.[0].databaseId')
# - fixtures, corpus: crates/ooxml-oracle/python/word_edits_diff.py's modes, docx-agent (pure
#   Python) against the release `word-edits`, on docx-agent's fixtures and on the documents
#   docx2svg's tools/make_*.py make; each mode in `shards` jobs (tools/gates.py);
# - reads: word_reads_diff.py's checks on the fixtures (`word-ids`, `word-reads`);
# - seeds: the multi-writer seed runs (`--ignored`) in release;
# - bench: the 3k-page benches on a made-up report generated here (tools/gates.py report).
# A case with differences fails its job unless crates/ooxml-oracle/known-differences.toml
# covers it (with its cause).  The job summary has a table per gate; each job's logs are
# uploaded.  Bench timings are a shared runner's: reported, never failed on.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch (or commit) to run the gates on
        default: main
      gates:
        description: "Comma list of: fixtures, corpus, reads, seeds, bench"
        default: fixtures,corpus,reads,seeds,bench
      modes:
        description: "word_edits_diff.py modes for fixtures and corpus (all, or a comma list: set_text, ops, paragraphs, delete, cells, styled, markdown, spacing, text, tools, review, structure, objects, style)"
        default: all
      per_tool:
        description: "Cases per tool and document (empty: all on fixtures and reads, 10 on the corpus; 0: all)"
        default: ""
      every:
        description: Every n-th document of each tree
        default: "1"
      shards:
        description: Jobs per mode
        default: "6"

concurrency:
  group: gates-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      seeds: ${{ contains(inputs.gates, 'seeds') }}
      bench: ${{ contains(inputs.gates, 'bench') }}
      corpus: ${{ contains(inputs.gates, 'corpus') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: plan
        env:
          GATES: ${{ inputs.gates }}
          MODES: ${{ inputs.modes }}
          SHARDS: ${{ inputs.shards }}
          PER_TOOL: ${{ inputs.per_tool }}
          REF: ${{ inputs.ref }}
          EVERY: ${{ inputs.every }}
        run: |
          matrix=$(python3 tools/gates.py matrix --gates "$GATES" --modes "$MODES" --shards "$SHARDS" --per-tool "$PER_TOOL")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "ref $REF at $(git rev-parse HEAD); gates $GATES; modes $MODES; per_tool '${PER_TOOL}'; every $EVERY; shards $SHARDS" >> "$GITHUB_STEP_SUMMARY"

  # The release oracle binaries, once per run.
  oracles:
    needs: plan
    if: needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gates-oracles
      - name: Build
        run: |
          cargo build --locked --release -p ooxml-oracle --bin word-edits --bin word-reads --bin word-ids
          mkdir -p oracles && cp target/release/word-edits target/release/word-reads target/release/word-ids oracles/
      - uses: actions/upload-artifact@v4
        with:
          name: oracles
          path: oracles/
          retention-days: 3

  # docx2svg's made-up documents, as the word-model job (rust.yml) makes them.
  corpus:
    needs: plan
    if: needs.plan.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ./python/ooxml-common "./python/docx2svg[measure]"
      - name: Make the corpus
        run: python tools/gates.py corpus "$RUNNER_TEMP/corpus"
      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: ${{ runner.temp }}/corpus/
          retention-days: 3

  differential:
    name: ${{ matrix.gate }} ${{ matrix.mode }} ${{ matrix.shard }}
    needs: [plan, oracles, corpus]
    if: >-
      always() && needs.plan.outputs.matrix != '' && needs.oracles.result == 'success' &&
      (needs.corpus.result == 'success' || needs.corpus.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # docx-agent is the reference: pure Python, so not ooxml-core (DOCX_AGENT_RUST=0 too).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./python/ooxml-common ./python/ooxml-edit "./python/docx2svg[measure]" markdown-it-py mdit-py-plugins
          python -m pip install --no-deps ./python/docx-agent
      - uses: ./.github/actions/substitute-fonts
      - uses: actions/download-artifact@v4
        with:
          name: oracles
          path: ${{ runner.temp }}/oracles
      - if: matrix.gate == 'corpus'
        uses: actions/download-artifact@v4
        with:
          name: corpus
          path: ${{ runner.temp }}/corpus
      - name: Differential
        env:
          GATE: ${{ matrix.gate }}
          MODE: ${{ matrix.mode }}
          SHARD: ${{ matrix.shard }}
          PER_TOOL: ${{ matrix.per_tool }}
          EVERY: ${{ inputs.every }}
        run: |
          chmod +x "$RUNNER_TEMP"/oracles/*
          tree=()
          if [ "$GATE" = corpus ]; then tree=(--tree "$RUNNER_TEMP/corpus"); fi
          python tools/gates.py diff --gate "$GATE" --mode "$MODE" --shard "$SHARD" --per-tool "$PER_TOOL" \
            --every "$EVERY" --bin "$RUNNER_TEMP/oracles" --out "$RUNNER_TEMP/out/$GATE-$MODE-${SHARD%/*}" "${tree[@]}"
      - name: Name the logs
        if: always()
        id: name
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "name=diff-${{ matrix.gate }}-${{ matrix.mode }}-${SHARD%/*}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            ${{ runner.temp }}/out/*/log.txt
            ${{ runner.temp }}/out/*/results.jsonl
            ${{ runner.temp }}/out/*/summary.json
          retention-days: 14

  summary:
    needs: [plan, differential]
    if: always() && needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: diff-*
          path: ${{ runner.temp }}/diffs
      - name: Differentials
        run: python3 tools/gates.py summary "$RUNNER_TEMP/diffs" >> "$GITHUB_STEP_SUMMARY"

  seeds:
    needs: plan
    if: needs.plan.outputs.seeds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gates-seeds
      # The multi-writer runs each lane gates on (ooxml-word-edit's *_writers.rs and the
      # undo history's), the relayout's sixty seeds, and ooxml-store's and ooxml-session's
      # tests ignored ones included.
      - name: Seeds
        run: |
          start=$(date +%s)
          cargo test --locked --release -p ooxml-word-edit -p ooxml-word-layout -p ooxml-store -p ooxml-session --no-run
          status=0
          echo "| run | result | wall (s) |" > "$RUNNER_TEMP/seeds.md"
          echo "|---|---|---:|" >> "$RUNNER_TEMP/seeds.md"
          # Each run on its own: one failing still lets the others run.
          run() {
            local name=$1; shift
            local at=$(date +%s)
            if "$@" >> "$RUNNER_TEMP/seeds.log" 2>&1; then r=ok; else r=FAILED; status=1; fi
            echo "| $name | $r | $(( $(date +%s) - at )) |" >> "$RUNNER_TEMP/seeds.md"
          }
          for t in writers style_writers structure_writers review_writers object_writers history; do
            run "ooxml-word-edit $t" cargo test --locked --release -p ooxml-word-edit --test "$t" -- --ignored --nocapture
          done
          run "ooxml-word-layout relayout sixty_seeds" cargo test --locked --release -p ooxml-word-layout --test relayout -- --ignored --nocapture sixty_seeds
          run "ooxml-store, ooxml-session" cargo test --locked --release -p ooxml-store -p ooxml-session -- --include-ignored --nocapture
          {
            echo "### seeds ($(( $(date +%s) - start )) s with the build)"
            echo
            cat "$RUNNER_TEMP/seeds.md"
            echo '```'
            grep -E 'seeds|^test result|FAILED|panicked|assertion' "$RUNNER_TEMP/seeds.log" | cut -c1-400 | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seeds-log
          path: ${{ runner.temp }}/seeds.log
          retention-days: 14

  bench:
    needs: plan
    if: needs.plan.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gates-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # docx-agent with ooxml-core (its Rust session: writers_bench.py measures it).
      - name: Install
        run: python tools/ci.py install docx-agent
      - uses: ./.github/actions/substitute-fonts
      # The 3k-page report: make_report.py's 6 chapters grown to 61 (about 3,000 pages), made
      # once per generator version and kept in the cache.
      - name: Restore the 3k document
        id: long
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/long/long-61.docx
          key: gates-long-61-${{ hashFiles('python/ooxml-core/tests/harness/make_report.py', 'python/ooxml-core/tests/harness/grow_report.py', 'python/docx-agent/pyproject.toml', 'python/docx2svg/pyproject.toml') }}
      - name: Make the 3k document
        if: steps.long.outputs.cache-hit != 'true'
        run: |
          start=$(date +%s)
          python tools/gates.py report "$RUNNER_TEMP/long/long-61.docx" 6 61
          echo "made the 3k document in $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
      - name: Save the 3k document
        if: steps.long.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/long/long-61.docx
          key: ${{ steps.long.outputs.cache-primary-key }}
      - name: Build
        run: |
          cargo build --locked --release -p ooxml-oracle --bin word-edits-bench --bin word-objects-bench
          cargo test --locked --release -p ooxml-word-edit --test object_bench --test structure_bench --test style_bench --no-run
          cargo test --locked --release -p ooxml-tools-word --test template_bench --test fields_bench --no-run
      # Each bench once, at most 30 minutes; a failing bench is reported and the others still run.
      - name: Benches
        env:
          DOC: ${{ runner.temp }}/long/long-61.docx
          OBJECTS_BENCH: ${{ runner.temp }}/long/long-61.docx
          STRUCTURE_BENCH: ${{ runner.temp }}/long/long-61.docx
          STYLE_BENCH: ${{ runner.temp }}/long/long-61.docx
          TEMPLATE_BENCH: ${{ runner.temp }}/long/long-61.docx
          FIELDS_BENCH: ${{ runner.temp }}/long/long-61.docx
        run: |
          out="$RUNNER_TEMP/bench"; mkdir -p "$out"
          status=0
          bench() {
            local name=$1; shift
            local start=$(date +%s)
            if timeout 1800 "$@" > "$out/$name.txt" 2>&1; then r=ok; else r="failed ($?; 124 is the 30-minute limit)"; status=1; fi
            echo "| $name | $r | $(( $(date +%s) - start )) |" >> "$out/table.md"
          }
          echo "| bench | result | wall (s) |" > "$out/table.md"
          echo "|---|---|---:|" >> "$out/table.md"
          bench word-edits-bench target/release/word-edits-bench "$DOC" 24 5
          bench word-objects-bench target/release/word-objects-bench "$DOC"
          bench word-edit-benches cargo test --locked --release -p ooxml-word-edit --test object_bench --test structure_bench --test style_bench -- --ignored --nocapture
          bench tools-word-benches cargo test --locked --release -p ooxml-tools-word --test template_bench --test fields_bench -- --ignored --nocapture
          bench docx-agent-24-writers python python/docx-agent/tools/writers_bench.py "$DOC" 24 5 rust
          {
            echo "### bench (a shared runner: timings are noisy and not compared with a laptop's)"
            echo
            echo "The 3k document is generated here (make_report.py 6 chapters grown to 61), not the earlier"
            echo "long-61.docx: the bench series restarts with this workflow."
            echo
            cat "$out/table.md"
            for f in "$out"/*.txt; do
              echo; echo "#### $(basename "$f" .txt)"; echo '```'
              grep -E ' ms|pages|best of|p50|p99|^\{|error|panicked' "$f" | cut -c1-600 | head -40
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: ${{ runner.temp }}/bench/
          retention-days: 14
