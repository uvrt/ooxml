name: Gates
# Each run's title names its ref, gates and modes (`gh run list --workflow gates.yml --json
# displayTitle`), so a lane finds its own run among several queued at once.
run-name: Gates ${{ inputs.ref || 'main' }} [${{ inputs.gates || 'fixtures,corpus' }} / ${{ inputs.modes || 'all' }} / fixtures ${{ inputs.fixtures || 'all' }}]

# The heavy gates a lane runs before its pull request is done, on GitHub's Linux runners, on
# demand and nightly on main (never on push, not a required check):
#   gh workflow run gates.yml --repo uvrt/ooxml -f ref=<branch> -f gates=fixtures,corpus,seeds
# modes `auto` (the default) runs the edit modes, and the reads' checks, that the branch's
# changes against main can affect (tools/gates.py plan); `all` or a comma list names them.
#   gh run watch --repo uvrt/ooxml $(gh run list --repo uvrt/ooxml --workflow gates.yml --limit 1 --json databaseId -q '.[0].databaseId')
# - fixtures, corpus: crates/ooxml-oracle/python/word_edits_diff.py's modes, docx-agent (pure
#   Python) against the release `word-edits`, on docx-agent's fixtures and on the documents
#   docx2svg's tools/make_*.py make; each mode in `shards` jobs, or with shards `auto` (the
#   default) as tools/gates_jobs.py sizes them: when the reference cache holds a store for the
#   checkout (warm) one job per mode, the small modes of a gate sharing one; when cold three;
# - reads: word_reads_diff.py's checks on the fixtures (`word-ids`, `word-reads`);
# - seeds: the multi-writer seed runs (`--ignored`) in release;
# - bench: the 3k-page benches on a made-up report generated here (tools/gates.py report).
# A case with differences fails its job unless crates/ooxml-oracle/known-differences.toml
# covers it (with its cause).  The job summary has a table per gate; each job's logs are
# uploaded.  Bench timings are a shared runner's: reported, never failed on.
# docx-agent's results are kept between runs (crates/ooxml-oracle/python/reference_cache.py):
# each edit-mode job restores the store for the reference code it runs, computes only the
# cases it lacks, and reference-cache adds those to the store.  A new dispatch with the same
# inputs cancels the run before it.  The plan job resolves `ref` to one commit and every other
# job checks out that commit (a branch that moves while the run queues does not change it).
# fixtures `auto` (the default) runs, on the fixtures and reads gates, the fixtures holding the
# Word features the branch's changes touch and a few canaries (tools/gates_fixtures.py);
# `all` every fixture.  Nightly (schedule) on main: fixtures all and the corpus, every mode.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: The branch (or commit) to run the gates on
        default: main
      gates:
        description: "Comma list of: fixtures, corpus, reads, seeds, bench"
        default: fixtures,corpus,reads,seeds,bench
      modes:
        description: "word_edits_diff.py modes for fixtures and corpus (auto: those the branch's changes can affect, and the reads only if they can; all; or a comma list: set_text, ops, paragraphs, delete, cells, styled, markdown, spacing, text, tools, review, structure, objects, style)"
        default: auto
      per_tool:
        description: "Cases per tool and document (empty: all on fixtures and reads, 10 on the corpus; 0: all)"
        default: ""
      every:
        description: Every n-th document of each tree
        default: "1"
      fixtures:
        description: "The fixtures for fixtures and reads (auto: those holding the features the branch's changes touch, and the canaries -- tools/gates_fixtures.py; all; or a comma list)"
        default: auto
      shards:
        # auto: the plan job looks the reference cache's store up (warm: one shard a mode, the
        # gate's small modes in one job; cold: 3) -- tools/gates_jobs.py; a number wins.
        description: "Jobs per mode (auto: 1 and small modes bundled when the reference cache is warm, 3 when cold)"
        default: auto
  # Nightly on main: every fixture and the corpus, every mode, at the commit main is at when
  # the run starts (the summary names it, so a failure is bisected between two nightlies).
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: gates-${{ inputs.ref || 'main' }}-${{ inputs.gates || 'fixtures,corpus' }}-${{ inputs.modes || 'all' }}-${{ inputs.per_tool }}-${{ inputs.every || '1' }}-${{ inputs.shards || 'auto' }}-${{ inputs.fixtures || 'all' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      # inputs.ref (main on the nightly run) as one commit: every job checks out this one, so a branch that moves while
      # the run queues cannot pair one commit's oracles with another's cases.
      sha: ${{ steps.plan.outputs.sha }}
      seeds: ${{ contains(inputs.gates || 'fixtures,corpus', 'seeds') }}
      bench: ${{ contains(inputs.gates || 'fixtures,corpus', 'bench') }}
      corpus: ${{ steps.plan.outputs.corpus }}
      fixtures: ${{ steps.plan.outputs.fixtures }}
    steps:
      # The whole history: modes auto compares the ref with its merge base with main.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0
      # Warm or cold: whether the reference cache holds a store for the reference code this
      # checkout runs (its key computed as the differential jobs compute it).  Only for the edit
      # gates with shards auto.
      - id: lookup
        env:
          GATES: ${{ inputs.gates || 'fixtures,corpus' }}
          SHARDS: ${{ inputs.shards || 'auto' }}
        run: |
          lookup=false
          if [ "$SHARDS" = auto ]; then case ",$GATES," in *,fixtures,*|*,corpus,*) lookup=true;; esac; fi
          echo "lookup=$lookup" >> "$GITHUB_OUTPUT"
      - if: steps.lookup.outputs.lookup == 'true'
        uses: ./.github/actions/gates-reference
      - if: steps.lookup.outputs.lookup == 'true'
        id: chain
        run: echo "chain=$(python tools/gates.py cache-key)" >> "$GITHUB_OUTPUT"
      - if: steps.lookup.outputs.lookup == 'true'
        id: store
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reference
          key: gates-reference-${{ steps.chain.outputs.chain }}-${{ github.run_id }}
          restore-keys: gates-reference-${{ steps.chain.outputs.chain }}-
          lookup-only: true
      - id: plan
        env:
          GATES: ${{ inputs.gates || 'fixtures,corpus' }}
          MODES: ${{ inputs.modes || 'all' }}
          SHARDS: ${{ inputs.shards || 'auto' }}
          STORE: ${{ steps.store.outputs.cache-matched-key }}
          PER_TOOL: ${{ inputs.per_tool }}
          REF: ${{ inputs.ref || 'main' }}
          EVERY: ${{ inputs.every || '1' }}
          FIXTURES: ${{ inputs.fixtures || 'all' }}
        run: |
          fixtures=$(python3 tools/gates.py fixtures --fixtures "$FIXTURES")
          echo "fixtures=$fixtures" >> "$GITHUB_OUTPUT"
          warm=()
          if [ -n "$STORE" ]; then warm=(--warm); fi
          matrix=$(python3 tools/gates.py matrix --gates "$GATES" --modes "$MODES" --shards "$SHARDS" --per-tool "$PER_TOOL" \
            --every "$EVERY" --fixtures "$fixtures" "${warm[@]}" 2> plan.txt)
          cat plan.txt
          echo "matrix: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "corpus=$(case "$matrix" in *'"gate": "corpus"'*) echo true;; *) echo false;; esac)" >> "$GITHUB_OUTPUT"
          echo "ref $REF at $(git rev-parse HEAD); gates $GATES; modes $MODES $(cat plan.txt); per_tool '${PER_TOOL}'; every $EVERY; shards $SHARDS; reference store ${STORE:-none}; fixtures $FIXTURES: $fixtures" >> "$GITHUB_STEP_SUMMARY"

  # The release oracle binaries, once per run.
  oracles:
    needs: plan
    if: needs.plan.outputs.matrix != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gates-oracles
      - name: Build
        run: |
          cargo build --locked --release -p ooxml-oracle --bin word-edits --bin word-reads --bin word-ids
          mkdir -p oracles && cp target/release/word-edits target/release/word-reads target/release/word-ids oracles/
      - uses: actions/upload-artifact@v4
        with:
          name: oracles
          path: oracles/
          retention-days: 3

  # docx2svg's made-up documents, as the word-model job (rust.yml) makes them.
  corpus:
    needs: plan
    if: needs.plan.outputs.corpus == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ./python/ooxml-common "./python/docx2svg[measure]"
      - name: Make the corpus
        run: python tools/gates.py corpus "$RUNNER_TEMP/corpus"
      - uses: actions/upload-artifact@v4
        with:
          name: corpus
          path: ${{ runner.temp }}/corpus/
          retention-days: 3

  # One job of tools/gates_jobs.py's: a gate's modes (one, or a bundle run one after another)
  # in one shard; each mode's results in its own folder of the job's logs.
  differential:
    name: ${{ matrix.gate }} ${{ matrix.modes }} ${{ matrix.shard }}
    needs: [plan, oracles, corpus]
    if: >-
      always() && needs.plan.outputs.matrix != '' && needs.oracles.result == 'success' &&
      (needs.corpus.result == 'success' || needs.corpus.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      chain: ${{ steps.chain.outputs.chain }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      # docx-agent is the reference: pure Python, so not ooxml-core (DOCX_AGENT_RUST=0 too).
      - uses: ./.github/actions/gates-reference
      - uses: ./.github/actions/substitute-fonts
      - uses: actions/download-artifact@v4
        with:
          name: oracles
          path: ${{ runner.temp }}/oracles
      - if: matrix.gate == 'corpus'
        uses: actions/download-artifact@v4
        with:
          name: corpus
          path: ${{ runner.temp }}/corpus
      # The store of docx-agent's results for the reference code this checkout runs.
      - name: Reference cache key
        if: matrix.gate != 'reads'
        id: chain
        run: echo "chain=$(python tools/gates.py cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore docx-agent's kept results
        if: matrix.gate != 'reads'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reference
          key: gates-reference-${{ steps.chain.outputs.chain }}-${{ github.run_id }}
          restore-keys: gates-reference-${{ steps.chain.outputs.chain }}-
      - name: Differential
        env:
          GATE: ${{ matrix.gate }}
          MODES: ${{ matrix.modes }}
          SHARD: ${{ matrix.shard }}
          PER_TOOL: ${{ matrix.per_tool }}
          EVERY: ${{ inputs.every || '1' }}
          FIXTURES: ${{ needs.plan.outputs.fixtures }}
        run: |
          chmod +x "$RUNNER_TEMP"/oracles/*
          tree=()
          if [ "$GATE" = corpus ]; then tree=(--tree "$RUNNER_TEMP/corpus"); fi
          cache=()
          if [ "$GATE" != reads ]; then cache=(--cache "$RUNNER_TEMP/reference"); fi
          # Each mode on its own: one failing still lets the others run.
          status=0
          for mode in ${MODES//,/ }; do
            echo "::group::$GATE $mode $SHARD"
            python tools/gates.py diff --gate "$GATE" --mode "$mode" --shard "$SHARD" --per-tool "$PER_TOOL" \
              --every "$EVERY" --bin "$RUNNER_TEMP/oracles" --out "$RUNNER_TEMP/out/$GATE-$mode-${SHARD%/*}" \
              --fixtures "$FIXTURES" "${tree[@]}" "${cache[@]}" || status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Name the logs
        if: always()
        id: name
        env:
          SHARD: ${{ matrix.shard }}
          LABEL: ${{ matrix.label }}
        run: echo "name=diff-${{ matrix.gate }}-${LABEL}-${SHARD%/*}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            ${{ runner.temp }}/out/*/log.txt
            ${{ runner.temp }}/out/*/results.jsonl
            ${{ runner.temp }}/out/*/summary.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && matrix.gate != 'reads'
        with:
          name: reference-${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/out/*/reference-new.jsonl.gz
          if-no-files-found: ignore
          retention-days: 1

  summary:
    needs: [plan, differential]
    if: ${{ !cancelled() && needs.plan.outputs.matrix != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: diff-*
          path: ${{ runner.temp }}/diffs
      - name: Differentials
        env:
          REF: ${{ inputs.ref || 'main' }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          echo "Every job ran $REF at $SHA." >> "$GITHUB_STEP_SUMMARY"
          python3 tools/gates.py summary "$RUNNER_TEMP/diffs" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "<details><summary>The warm modes' times (tools/gates_durations.json: python tools/gates.py durations DIR --write)</summary>"
            echo; echo '```json'
            python3 tools/gates.py durations "$RUNNER_TEMP/diffs"
            echo '```'; echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  # The results the differential jobs computed, added to the store they restored (saved as a
  # new cache entry; the next run restores the newest).
  reference-cache:
    needs: [plan, differential]
    if: ${{ !cancelled() && needs.differential.outputs.chain != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: reference-diff-*
          path: ${{ runner.temp }}/new
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/reference
          key: gates-reference-${{ needs.differential.outputs.chain }}-${{ github.run_id }}
          restore-keys: gates-reference-${{ needs.differential.outputs.chain }}-
      - name: Merge
        id: merge
        run: |
          shopt -s globstar nullglob
          added=$(python3 tools/gates.py cache-merge "$RUNNER_TEMP/reference" "$RUNNER_TEMP"/new/**/reference-new.jsonl.gz)
          echo "$added; the store: $(du -h "$RUNNER_TEMP/reference" | cut -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "added=${added%% *}" >> "$GITHUB_OUTPUT"
      - if: steps.merge.outputs.added != '0'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/reference
          key: gates-reference-${{ needs.differential.outputs.chain }}-${{ github.run_id }}-${{ github.run_attempt }}

  seeds:
    needs: plan
    if: needs.plan.outputs.seeds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gates-seeds
      # The multi-writer runs each lane gates on (ooxml-word-edit's *_writers.rs and the
      # undo history's), the relayout's sixty seeds, and ooxml-store's and ooxml-session's
      # tests ignored ones included.
      - name: Seeds
        run: |
          start=$(date +%s)
          cargo test --locked --release -p ooxml-word-edit -p ooxml-word-layout -p ooxml-store -p ooxml-session --no-run
          status=0
          echo "| run | result | wall (s) |" > "$RUNNER_TEMP/seeds.md"
          echo "|---|---|---:|" >> "$RUNNER_TEMP/seeds.md"
          # Each run on its own: one failing still lets the others run.
          run() {
            local name=$1; shift
            local at=$(date +%s)
            if "$@" >> "$RUNNER_TEMP/seeds.log" 2>&1; then r=ok; else r=FAILED; status=1; fi
            echo "| $name | $r | $(( $(date +%s) - at )) |" >> "$RUNNER_TEMP/seeds.md"
          }
          # One test program per crate (tests/integration); each run picks its module's long test by its exact name.
          for t in writers::sixty_seeds_of_eight_writers style_writers::sixty_seeds_of_eight_writers_styling \
            structure_writers::sixty_seeds_of_eight_writers_structuring review_writers::sixty_seeds_of_eight_writers_reviewing \
            object_writers::sixty_seeds_of_eight_writers_formatting_tables history::sixty_seeds_of_eight_writers_with_undo; do
            run "ooxml-word-edit ${t%%::*}" cargo test --locked --release -p ooxml-word-edit --test integration -- --ignored --nocapture --exact "$t"
          done
          run "ooxml-word-layout relayout sixty_seeds" cargo test --locked --release -p ooxml-word-layout --test integration -- --ignored --nocapture --exact relayout::sixty_seeds
          run "ooxml-store, ooxml-session" cargo test --locked --release -p ooxml-store -p ooxml-session -- --include-ignored --nocapture
          {
            echo "### seeds ($(( $(date +%s) - start )) s with the build)"
            echo
            cat "$RUNNER_TEMP/seeds.md"
            echo '```'
            grep -E 'seeds|^test result|FAILED|panicked|assertion' "$RUNNER_TEMP/seeds.log" | cut -c1-400 | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seeds-log
          path: ${{ runner.temp }}/seeds.log
          retention-days: 14

  bench:
    needs: plan
    if: needs.plan.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gates-bench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # docx-agent with ooxml-core (its Rust session: writers_bench.py measures it).
      - name: Install
        run: python tools/ci.py install docx-agent
      - uses: ./.github/actions/substitute-fonts
      # The 3k-page report: make_report.py's 6 chapters grown to 61 (about 3,000 pages), made
      # once per generator version and kept in the cache.
      - name: Restore the 3k document
        id: long
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/long/long-61.docx
          key: gates-long-61-${{ hashFiles('python/ooxml-core/tests/harness/make_report.py', 'python/ooxml-core/tests/harness/grow_report.py', 'python/docx-agent/pyproject.toml', 'python/docx2svg/pyproject.toml') }}
      - name: Make the 3k document
        if: steps.long.outputs.cache-hit != 'true'
        run: |
          start=$(date +%s)
          python tools/gates.py report "$RUNNER_TEMP/long/long-61.docx" 6 61
          echo "made the 3k document in $(( $(date +%s) - start )) s" >> "$GITHUB_STEP_SUMMARY"
      - name: Save the 3k document
        if: steps.long.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/long/long-61.docx
          key: ${{ steps.long.outputs.cache-primary-key }}
      - name: Build
        run: |
          cargo build --locked --release -p ooxml-oracle --bin word-edits-bench --bin word-objects-bench
          cargo test --locked --release -p ooxml-word-edit --test integration --no-run
          cargo test --locked --release -p ooxml-tools-word --test integration --no-run
      # Each bench once, within its own limit (bench NAME LIMIT ...); a failing bench is reported and the others still run.
      # The benches of one test program run one at a time (--test-threads 1), as their separate
      # programs did, so no timing shares the runner with another.
      - name: Benches
        env:
          DOC: ${{ runner.temp }}/long/long-61.docx
          OBJECTS_BENCH: ${{ runner.temp }}/long/long-61.docx
          STRUCTURE_BENCH: ${{ runner.temp }}/long/long-61.docx
          STYLE_BENCH: ${{ runner.temp }}/long/long-61.docx
          TEMPLATE_BENCH: ${{ runner.temp }}/long/long-61.docx
          FIELDS_BENCH: ${{ runner.temp }}/long/long-61.docx
        run: |
          out="$RUNNER_TEMP/bench"; mkdir -p "$out"
          status=0
          # bench NAME LIMIT COMMAND...: LIMIT seconds for this bench alone.
          bench() {
            local name=$1 limit=$2; shift 2
            local start=$(date +%s)
            if timeout "$limit" "$@" > "$out/$name.txt" 2>&1; then r=ok; else r="failed ($?; 124 is the ${limit} s limit)"; status=1; fi
            echo "| $name | $r | $(( $(date +%s) - start )) |" >> "$out/table.md"
          }
          echo "| bench | result | wall (s) |" > "$out/table.md"
          echo "|---|---|---:|" >> "$out/table.md"
          bench word-edits-bench 1800 target/release/word-edits-bench "$DOC" 24 5
          bench word-objects-bench 1800 target/release/word-objects-bench "$DOC"
          bench word-edit-benches 1800 cargo test --locked --release -p ooxml-word-edit --test integration -- --ignored --nocapture --test-threads 1 object_bench:: structure_bench:: style_bench::
          # template and fields each alone (together they took 1,555 s on one run and passed 1,800
          # on a runner about a quarter slower): 2,700 s each.
          bench tools-word-template-bench 2700 cargo test --locked --release -p ooxml-tools-word --test integration -- --ignored --nocapture --test-threads 1 template_bench::
          bench tools-word-fields-bench 2700 cargo test --locked --release -p ooxml-tools-word --test integration -- --ignored --nocapture --test-threads 1 fields_bench::
          bench docx-agent-24-writers 1800 python python/docx-agent/tools/writers_bench.py "$DOC" 24 5 rust
          {
            echo "### bench (a shared runner: timings are noisy and not compared with a laptop's)"
            echo
            echo "The 3k document is generated here (make_report.py 6 chapters grown to 61), not the earlier"
            echo "long-61.docx: the bench series restarts with this workflow."
            echo
            cat "$out/table.md"
            for f in "$out"/*.txt; do
              echo; echo "#### $(basename "$f" .txt)"; echo '```'
              grep -E ' ms|pages|best of|p50|p99|^\{|error|panicked' "$f" | cut -c1-600 | head -40
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: ${{ runner.temp }}/bench/
          retention-days: 14
