name: Rust

# The Rust workspace (crates/) and its Python module ooxml-core (python/ooxml-core):
# - `rust`: cargo fmt --check, cargo clippy -D warnings, cargo test, with a build cache;
# - `differential`: python/ooxml-core/tests -- the module's session API (open, calls,
#   refusals, limits, threads);
# - `rust-check`: docx-agent's check-related tests, served by the Rust session;
# - `wheels` (rust-wheels.yml): on a pull request Linux x86_64, on main, nightly and manual
#   runs Linux x86_64 and aarch64 (production is Linux only); a push to main builds them only
#   when its changes would on a pull request (rust_wheels below; release.yml always does).
# On a pull request `rust` runs when the change touches the workspace, ooxml-core, the
# packages the differential tests compare with (tools/ci.py, RUST_PREFIXES and
# RUST_REFERENCE) or the test workflows and tools/ci.py (RUN_ALL_PREFIXES); `differential`
# and `rust-check` when it touches what the Python module is built from (module_input), those
# packages or the differential tests (rust_module); `wheels` when it touches the bindings or a
# manifest or build script of the module's crates (rust_wheels).
# The architecture's crates add jobs that run on a pull request only when it changes their
# own paths, the test workflows, tools/ci.py or the workspace's Cargo files (tools/ci.py,
# RUST_JOBS), and on every push to main, nightly and manual run (fuzz: nightly and manual
# only):
# - `loom`: ooxml-store's commit path model-checked (--cfg loom, its own target dir);
# - `oracles`: tools/rust_oracles.py -- the XML writer and the package save against
#   ooxml-edit's on every document of the repository;
# - `word-model`: the Word model against docx2svg's layout input, on the repository's
#   documents and on those docx2svg's tools/make_*.py make;
# - `cargo-deny`: licences, duplicate versions, sources and advisories (deny.toml);
# - `fuzz`: fuzz/'s nine targets, 4 minutes each.  Not part of `required (rust)`: a find
#   shows as a failed job with the crashing input uploaded, without blocking a merge.  On a
#   pull request that changes the targets or their crates, `rust` only builds them.
# Not in CI: ooxml-oracle's `text-diff` (the text engine against docx2svg's records) needs
# Word's own fonts, so it stays a local gate (README, Development).
# `required (rust)` is the gate to require: it passes when every job it covers passed or
# was left out.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

# As ci.yml: a newer push to a pull request or to main cancels the older push's run;
# the nightly run and a manual run are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.event_name || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.plan.outputs.rust }}
      module: ${{ steps.plan.outputs.rust_module }}
      wheels: ${{ steps.plan.outputs.rust_wheels }}
      fuzz_check: ${{ steps.plan.outputs.rust_fuzz_check }}
      fuzz: ${{ steps.plan.outputs.rust_fuzz }}
      loom: ${{ steps.plan.outputs.rust_loom }}
      oracles: ${{ steps.plan.outputs.rust_oracles }}
      word_model: ${{ steps.plan.outputs.rust_word_model }}
      deny: ${{ steps.plan.outputs.rust_deny }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        run: python3 tools/ci.py plan --event ${{ github.event_name }}

  rust:
    name: rust (fmt, clippy, test)
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      # The fuzz job runs nightly; a pull request that changes its targets or their crates
      # checks here that they still build (without the coverage instrumentation).
      - name: The fuzz targets build
        if: needs.plan.outputs.fuzz_check == 'true'
        working-directory: fuzz
        run: cargo check --locked

  differential:
    name: ooxml-core (differential)
    needs: plan
    if: needs.plan.outputs.module == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install ./python/ooxml-core pytest

      - name: Differential tests
        working-directory: python/ooxml-core
        run: python -m pytest -q -ra tests

  rust-check:
    name: docx-agent check (Rust path on and off)
    needs: plan
    if: needs.plan.outputs.module == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python tools/ci.py install docx-agent

      # The documents are set in Calibri, laid out with Carlito where it is absent.  As in
      # python-tests.yml: from the apt mirror once, then from the Actions cache.
      - name: Restore the open substitute fonts from the cache
        id: substitute-fonts
        uses: actions/cache/restore@v4
        with:
          path: ~/substitute-fonts
          key: substitute-fonts-${{ runner.os }}-fonts-crosextra-carlito-fonts-crosextra-caladea-fonts-liberation-v1
      - name: Install the open substitute fonts
        if: steps.substitute-fonts.outputs.cache-hit != 'true'
        run: |
          packages="fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation"
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends $packages; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
          mkdir -p ~/substitute-fonts
          dpkg -L $packages | grep -E '^/(usr/share/fonts|usr/share/fontconfig|etc/fonts)/' |
            while read -r f; do
              if [ -f "$f" ] || [ -L "$f" ]; then cp -d --parents "$f" ~/substitute-fonts/; fi
            done
      - name: Save the open substitute fonts to the cache
        if: steps.substitute-fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/substitute-fonts
          key: ${{ steps.substitute-fonts.outputs.cache-primary-key }}
      - name: Put the cached substitute fonts in place
        env:
          CACHE_HIT: ${{ steps.substitute-fonts.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            sudo cp -dR ~/substitute-fonts/. /
            sudo fc-cache -f
          fi
          for family in Carlito Caladea "Liberation Sans" "Liberation Serif" "Liberation Mono"; do
            fc-list "$family" family | grep -q . || { echo "missing font: $family"; exit 1; }
          done

      # The tests a check of ranges goes through.
      - name: Check tests, Rust path on
        working-directory: python/docx-agent
        run: python -m pytest -q -ra -n 2 tests/test_check_owner.py tests/test_check_timing.py tests/test_range_extent.py tests/test_keep_spans.py tests/test_keep_trials.py tests/test_numbers.py tests/test_ranges.py tests/test_check_speed_r57.py

  wheels:
    name: wheels
    needs: plan
    if: needs.plan.outputs.wheels == 'true'
    uses: ./.github/workflows/rust-wheels.yml
    with:
      full: ${{ github.event_name != 'pull_request' }}

  loom:
    name: ooxml-store (loom)
    needs: plan
    if: needs.plan.outputs.loom == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Its own target dir: --cfg loom rebuilds every crate, and would otherwise evict the
      # ordinary build from the cache.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target/loom"
          key: loom
      - name: cargo test --test loom (RUSTFLAGS="--cfg loom")
        env:
          RUSTFLAGS: --cfg loom
          CARGO_TARGET_DIR: target/loom
        run: cargo test --locked -p ooxml-store --test loom --release

  oracles:
    name: oracles (XML writer, package save)
    needs: plan
    if: needs.plan.outputs.oracles == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # ooxml-edit is the reference (tools/rust_oracles.py's docstring).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./python/ooxml-common ./python/ooxml-edit
          cargo build --locked --release -p ooxml-xml -p ooxml-opc --example xml_contract --example save_contract
      # Every distinct XML part of the repository's documents: the Rust writer's bytes are
      # ooxml-edit's, and it refuses what lxml refuses.
      - name: XML pairs
        run: |
          python tools/rust_oracles.py xml-pairs "$RUNNER_TEMP/xml-pairs"
          target/release/examples/xml_contract "$RUNNER_TEMP/xml-pairs"
      # Every document saved unchanged (byte for byte the input) and with every part
      # touched (ooxml-edit's entries: names, order, metadata, bytes).
      - name: Touched saves
        run: |
          python tools/rust_oracles.py touched-save "$RUNNER_TEMP/saves"
          target/release/examples/save_contract "$RUNNER_TEMP/saves"
          python tools/rust_oracles.py compare-saves "$RUNNER_TEMP/saves"

  word-model:
    name: Word model (differential)
    needs: plan
    if: needs.plan.outputs.word_model == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The measure extra: fontTools, with which make_script_offset_probe.py builds its fonts.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./python/ooxml-common "./python/docx2svg[measure]" pytest
          cargo build --locked --release -p ooxml-oracle --bin word-model --bin drawingml-model --bin chart-model
      # Each generator in its own folder, run from there: they write there by default
      # (tools/make_layout_sweep.py and make_style_document.py rewrite docx2svg's committed
      # fixtures instead, which the --tree python below reads).
      - name: Make docx2svg's generated documents
        run: |
          for script in "$GITHUB_WORKSPACE"/python/docx2svg/tools/make_*.py; do
            dir="$RUNNER_TEMP/made/$(basename "$script" .py)"
            mkdir -p "$dir"
            (cd "$dir" && python "$script" > log.txt) || { cat "$dir/log.txt"; exit 1; }
          done
          find "$RUNNER_TEMP/made" -name '*.docx' | wc -l
      # Field by field; exits 1 on any difference.
      - name: Differential
        run: >-
          python crates/ooxml-oracle/python/word_model_diff.py --rust target/release/word-model
          --tree python --tree "$RUNNER_TEMP/made"
      # DrawingML: the model and resolved colours against ooxml-common's (pptx2svg's sources
      # importable), all presets and 20,000 generated colour cases; exits 1 on any difference.
      - name: DrawingML differential
        env:
          PYTHONPATH: python/ooxml-common/src:python/pptx2svg/src
        run: >-
          python crates/ooxml-oracle/python/drawingml_diff.py --rust target/release/drawingml-model
          --presets --swatches 20000 --tree python
          python/ooxml-common/tests/fixtures/trees/*.xml python/ooxml-common/tests/fixtures/themes/*.xml
      # Charts: the model and each chart laid out (both rule sets) against ooxml-common's, on
      # every package and chart XML in the repository; Python and Rust on one machine agree to
      # the bit.  Exits 1 on any difference.
      - name: Chart differential
        env:
          PYTHONPATH: python/ooxml-common/src:python/pptx2svg/src
        run: |
          python crates/ooxml-oracle/python/chart_diff.py --rust target/release/chart-model --tree python
          python crates/ooxml-oracle/python/chart_diff.py --rust target/release/chart-model --layout --tree python
      # The preset table in ooxml-drawingml equals ooxml-common's PRESETS.
      - name: Preset table is current
        env:
          PYTHONPATH: python/ooxml-common/src
        run: python crates/ooxml-drawingml/data/generate.py --check

  cargo-deny:
    name: cargo-deny
    needs: plan
    if: needs.plan.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-deny 0.20.2; deny.toml holds the policy (DEPENDENCIES.md's licences).
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check

  # Not required (the workflow's header).  Built as P0a ran it: stable rustc with
  # cargo-fuzz's coverage instrumentation (no sanitizer), for the runner's target so build
  # scripts and macros are left uninstrumented; seeded with the repository's documents and
  # their XML parts (tools/fuzz_seeds.py).
  fuzz:
    name: fuzz (4 minutes per target)
    needs: plan
    if: needs.plan.outputs.fuzz == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"
          key: fuzz
      - name: Build the targets
        working-directory: fuzz
        env:
          RUSTFLAGS: >-
            -Cpasses=sancov-module -Cllvm-args=-sanitizer-coverage-level=4
            -Cllvm-args=-sanitizer-coverage-inline-8bit-counters -Cllvm-args=-sanitizer-coverage-pc-table
            -Cllvm-args=-sanitizer-coverage-trace-compares -Cdebug-assertions -Coverflow-checks
        run: cargo build --locked --release --target x86_64-unknown-linux-gnu
      - name: Seed corpora
        run: python3 tools/fuzz_seeds.py "$RUNNER_TEMP/seeds"
      # Each target writes the inputs it finds to its own corpus and reads the seeds; every
      # target runs even when one finds a crash.
      - name: Fuzz
        run: |
          bin=fuzz/target/x86_64-unknown-linux-gnu/release
          status=0
          for pair in xml_roundtrip:xml zip_read:package opc_open:package metafile_draw:metafile chart_layout:xml drawing_render:xml vml_paint:xml glyph_ink:font markdown_parse:markdown; do
            target=${pair%%:*}
            mkdir -p "$RUNNER_TEMP/corpus/$target" "$RUNNER_TEMP/crashes/$target"
            "$bin/$target" "$RUNNER_TEMP/corpus/$target" "$RUNNER_TEMP/seeds/${pair##*:}" \
              -max_total_time=240 -rss_limit_mb=1536 -max_len=1048576 -timeout=20 -print_final_stats=1 \
              -artifact_prefix="$RUNNER_TEMP/crashes/$target/" || { echo "::error::$target failed"; status=1; }
          done
          exit $status
      - name: Upload the crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: ${{ runner.temp }}/crashes/
          if-no-files-found: ignore

  required-rust:
    name: required (rust)
    needs: [plan, rust, differential, rust-check, wheels, loom, oracles, word-model, cargo-deny]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Rust job passed or was left out
        env:
          RESULTS: ${{ needs.plan.result }} ${{ needs.rust.result }} ${{ needs.differential.result }} ${{ needs.rust-check.result }} ${{ needs.wheels.result }} ${{ needs.loom.result }} ${{ needs.oracles.result }} ${{ needs.word-model.result }} ${{ needs.cargo-deny.result }}
        run: |
          echo "plan, rust, differential, rust-check, wheels, loom, oracles, word-model, cargo-deny: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
