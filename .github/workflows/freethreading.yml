name: Free threading

# The suites on the free-threaded build of Python (3.15t), with the GIL off.  A separate
# workflow on purpose: ci.yml's `required` jobs are what branch protection requires, and
# this one is not required (yet).  Each leg first checks that importing the package, its
# modules and the extension modules its leg installs leaves the GIL off without PYTHON_GIL set (an extension
# that has not declared itself free-threading safe turns the GIL back on, with a
# RuntimeWarning); the suite then runs with PYTHON_GIL=0 and RuntimeWarning an error.  The
# packages on lxml take lxml 7 (a pre-release for now), which leaves the GIL off.
# tools/ci.py holds each package's flags.  The same path filter as ci.yml.
# Nightly and manual runs only (a manual run can name a branch: `gh workflow run
# freethreading.yml --ref <branch>`), and a pull request that changes this workflow or the
# one it calls; not on a push to main (from 2026-11-20): the legs are about as many as
# ci.yml's and not required, and GitHub runs a limited number of jobs at a time for the
# whole repository, so main's pushes leave them to the nightly run.

on:
  pull_request:
    paths:
      - .github/workflows/freethreading.yml
      - .github/workflows/python-tests.yml
  workflow_dispatch:
  # Nightly, half an hour after ci.yml's.  Linux only on every event (tools/ci.py plan,
  # `ft`): the macOS runners are the scarce ones.
  schedule:
    - cron: "37 2 * * *"

# As ci.yml: a newer push to a pull request cancels the older push's run; the nightly run
# and a manual run are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && github.event_name || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.plan.outputs.any }}
      ft: ${{ steps.plan.outputs.ft }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: plan
        run: python3 tools/ci.py plan --event ${{ github.event_name }}

  test:
    name: test
    needs: plan
    if: needs.plan.outputs.any == 'true'
    uses: ./.github/workflows/python-tests.yml
    with:
      matrix: ${{ needs.plan.outputs.ft }}
      free-threading: true

  # A failed nightly run opens an issue, or comments on the one still open (nightly-issue.yml).
  nightly-issue:
    name: nightly failure issue
    needs: [plan, test]
    if: always() && github.event_name == 'schedule' && contains(needs.*.result, 'failure')
    permissions:
      issues: write
    uses: ./.github/workflows/nightly-issue.yml
    with:
      needs: ${{ toJSON(needs) }}
