# TEMPORARY (lane L): block_stress on free-threaded Python in a loop, many shards, a watchdog
# that takes Python and native stacks of a hang.  Removed before the branch is handed back.
name: TEMPORARY free-threaded writers loop

# A push runs the loop when its last commit's message says [loop], the bench when [bench].
on:
  push:
    branches: [ft-writers]

jobs:
  loop:
    name: TEMPORARY writers loop (shard ${{ matrix.shard }})
    if: contains(github.event.head_commit.message, '[loop]')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15t"
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - name: gdb
        run: sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends gdb || true
      - name: Install
        run: python tools/ci.py install docx-agent --free-threading
      - name: Loop
        env:
          PYTHON_GIL: "0"
          DOCX_AGENT_FULL_VALIDATE: "1"
          OOXML_EDIT_VERIFY_SERIALIZED: "1"
          DOCX_AGENT_DRAFTS: "1"
          LOOP_ROUND: "3"
        run: |
          mkdir -p work/out && cd work
          if [ ${{ matrix.shard }} -gt 4 ]; then export MODES=more-tracked THREADS=8,16,24; fi
          ../.github/tmp-ft/watchdog.sh 420 &
          python ../.github/tmp-ft/loop.py ../python/docx-agent/tests ${{ matrix.shard }}${LOOP_ROUND:-0} 2400
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loop-shard-${{ matrix.shard }}
          path: work/out

  reports:
    name: TEMPORARY made-up reports
    if: contains(github.event.head_commit.message, '[bench]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15t"
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: python tools/ci.py install docx-agent --free-threading
      - name: Make
        env:
          PYTHON_GIL: "0"
        run: |
          mkdir -p reports && cd reports
          python ../.github/tmp-ft/make_report.py 6 r295.docx
          python ../.github/tmp-ft/make_report.py grow r295.docx 10 r3k.docx
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports

  bench:
    name: TEMPORARY writers bench (${{ matrix.config }})
    needs: reports
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        config: [295-d0, 295-d1, 3k-d0, 3k-d1force]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15t"
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        run: python tools/ci.py install docx-agent --free-threading
      - uses: actions/download-artifact@v4
        with:
          name: reports
          path: reports
      - name: Bench
        env:
          PYTHON_GIL: "0"
        run: |
          mkdir -p out
          config=${{ matrix.config }}
          pages=${config%%-*}; mode=${config#*-}
          extra=""
          if [ "$mode" = d0 ]; then export DOCX_AGENT_DRAFTS=0; else export DOCX_AGENT_DRAFTS=1; fi
          if [ "$mode" = d1force ]; then extra=--no-worth; fi
          lscpu | head -20
          for w in 1 4 8 16 24; do
            if [ $w = 1 ]; then turns=8; elif [ $pages = 3k ]; then turns=3; else turns=4; fi
            python .github/tmp-ft/bench.py reports/r$pages.docx out/bench-$config-w$w.json --writers $w --turns $turns $extra || echo "FAILED w$w"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.config }}
          path: out

  lxml-proxy:
    name: TEMPORARY lxml proxy finalized on another thread (${{ matrix.lock }})
    if: contains(github.event.head_commit.message, '[lxml]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lock: [lock, no-lock]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15t"
          allow-prereleases: true
      - name: Install
        run: python -m pip install --pre "lxml>=7.0.0b1"
      - name: Run
        env:
          PYTHON_GIL: "0"
        run: |
          for k in 1 2 3 4 5; do python .github/tmp-ft/lxml_proxy.py 120 ${{ matrix.lock == 'no-lock' && '--no-lock' || '' }} || true; done
