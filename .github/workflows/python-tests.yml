name: Python tests (one OS)

# Called by ci.yml (one call per OS, so each OS's legs can be required or not on its own)
# and by freethreading.yml.  `matrix` is tools/ci.py plan's output for that call: a list of
# {package, os, python}, and `coverage` on the leg that runs the suite under coverage,
# `core` on the legs whose install builds the Rust core (ooxml-core), `shard` and `shards`
# on the legs of a suite split into several jobs.  Each leg installs the package and the
# siblings it needs from this checkout, then runs the suite (or its shard's test files) as
# the package's own repository's CI ran it (tools/ci.py install / test; the differences
# between the packages live there).

on:
  workflow_call:
    inputs:
      matrix:
        type: string
        required: true
      free-threading:
        type: boolean
        default: false

jobs:
  test:
    name: ${{ matrix.package }} (${{ matrix.os }}, ${{ matrix.python }}${{ matrix.shards && format(', {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ${{ matrix.os }}
    # A hang fails the job (a test still running after 300 s prints every thread's
    # traceback on the free-threading legs) instead of running for 6 hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          # 3.15.0 is out (2026-10-09) but setup-python's version list may still offer only
          # its release candidates; this takes a final release whenever there is one.
          allow-prereleases: true
          # The third-party wheels pip downloads, kept between runs.
          cache: pip
          cache-dependency-path: python/*/pyproject.toml

      # pip builds ooxml-core with maturin into the workspace's target/: its dependencies
      # come from the Rust build cache, saved by runs on main only (a pull request's
      # branch cannot share its cache with the next pull request anyway).
      - uses: dtolnay/rust-toolchain@stable
        if: matrix.core
      - uses: Swatinem/rust-cache@v2
        if: matrix.core
        with:
          key: python-${{ matrix.python }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install
        run: python tools/ci.py install ${{ matrix.package }} ${{ inputs.free-threading && '--free-threading' || '' }}

      # The open substitutes with the Office faces' widths (docx2svg's README, "Fonts"): with them the
      # Word layout runs past the first paragraph on a runner without Office's faces, so the
      # render, reflow and field tests run rather than skip.  Never a font file in the
      # repository.  Windows has Calibri, Arial, Times New Roman and Courier New itself.
      # The fonts come from the apt mirror once, then from the Actions cache, so a mirror
      # outage cannot turn a run red: on a miss apt installs them (with retries) and every
      # file the packages put under the font and fontconfig directories is cached with its
      # path; on a hit those files go back to the same paths and apt is not touched.
      - name: Restore the open substitute fonts from the cache (Linux)
        id: substitute-fonts
        if: runner.os == 'Linux' && (matrix.package == 'docx2svg' || matrix.package == 'docx-agent')
        uses: actions/cache/restore@v4
        with:
          path: ~/substitute-fonts
          key: substitute-fonts-${{ runner.os }}-fonts-crosextra-carlito-fonts-crosextra-caladea-fonts-liberation-v1
      - name: Install the open substitute fonts (Linux)
        if: runner.os == 'Linux' && (matrix.package == 'docx2svg' || matrix.package == 'docx-agent') && steps.substitute-fonts.outputs.cache-hit != 'true'
        run: |
          packages="fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation"
          for attempt in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 update &&
               sudo apt-get -o Acquire::Retries=5 install -y --no-install-recommends $packages; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
          mkdir -p ~/substitute-fonts
          dpkg -L $packages | grep -E '^/(usr/share/fonts|usr/share/fontconfig|etc/fonts)/' |
            while read -r f; do
              if [ -f "$f" ] || [ -L "$f" ]; then cp -d --parents "$f" ~/substitute-fonts/; fi
            done
      - name: Save the open substitute fonts to the cache (Linux)
        if: runner.os == 'Linux' && (matrix.package == 'docx2svg' || matrix.package == 'docx-agent') && steps.substitute-fonts.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/substitute-fonts
          key: ${{ steps.substitute-fonts.outputs.cache-primary-key }}
      - name: Put the cached substitute fonts in place and check them (Linux)
        if: runner.os == 'Linux' && (matrix.package == 'docx2svg' || matrix.package == 'docx-agent')
        env:
          CACHE_HIT: ${{ steps.substitute-fonts.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            sudo cp -dR ~/substitute-fonts/. /
            sudo fc-cache -f
          fi
          fc-list : family style file | grep -E 'Carlito|Caladea|Liberation' | sort
          for family in Carlito Caladea "Liberation Sans" "Liberation Serif" "Liberation Mono"; do
            fc-list "$family" family | grep -q . || { echo "missing font: $family"; exit 1; }
          done
      - name: Install the open substitute fonts (macOS)
        if: runner.os == 'macOS' && (matrix.package == 'docx2svg' || matrix.package == 'docx-agent')
        run: brew install --cask font-carlito font-caladea font-liberation

      - name: Importing the package leaves the GIL off
        if: inputs.free-threading
        run: python tools/ci.py gil-check ${{ matrix.package }}

      # The Office oracle tests are opt-in and need Office, which no runner has; the
      # provider tests need an API key, which CI does not hold.  Both skip.
      # A shard runs its test files only and writes a JUnit report, kept for a week:
      # `python tools/ci.py durations PACKAGE [--free-threading] junit-*/junit.xml` refreshes
      # tools/ci_durations.json from a run's reports when the shards' times drift apart.
      - name: Test
        shell: bash
        run: python tools/ci.py test ${{ matrix.package }} --event ${{ github.event_name }} ${{ inputs.free-threading && '--free-threading' || '' }} ${{ matrix.coverage && '--coverage' || '' }} ${{ matrix.shards && format('--shard {0}/{1} --junit junit.xml', matrix.shard, matrix.shards) || '' }}
      - name: Keep the shard's JUnit report
        if: always() && matrix.shards
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.package }}-${{ matrix.python }}-${{ matrix.shard }}
          path: junit.xml
          retention-days: 7
          if-no-files-found: ignore
