name: CI

# The seven Python packages' suites, lint, type check and build.  On a pull request only
# the packages its change touches and every package that depends on one of them run
# (tools/ci.py, PACKAGES: the dependency graph); a change to the workflows or to tools/
# runs them all.  A push to main, the nightly run and a manual run take every package.
# The Pythons per OS (tools/ci.py, LEGS), sparing the few macOS runners (development and
# local test runs already happen on macOS):
#   pull request:          Linux oldest + newest, Windows newest, no macOS;
#   push to main:          Linux every Python, Windows oldest + newest, no macOS;
#   nightly, manual run:   Linux and Windows every Python, macOS the newest.
#
# Branch protection requires the `required (...)` jobs at the end, not the legs: a leg
# that a path filter leaves out never reports, and a required check that never reports
# blocks the merge.  Each `required` job passes when every leg it covers passed or was
# left out, and fails otherwise.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so a dependency's change that breaks a package shows the next morning.
  schedule:
    - cron: "7 2 * * *"

# One run per pull request, and one per push to main, at a time: a newer push cancels the
# older push's run, queued or running, so stacked merges test only the newest commit.  The
# nightly run and a manual run are never cancelled and never wait: their group ends in the
# run's own id.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.event_name || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.plan.outputs.any }}
      linux: ${{ steps.plan.outputs.linux }}
      windows: ${{ steps.plan.outputs.windows }}
      macos: ${{ steps.plan.outputs.macos }}
      any_macos: ${{ steps.plan.outputs.any_macos }}
      build: ${{ steps.plan.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull request's checkout is its merge commit; its first parent is the base.
          fetch-depth: 2
      - name: The plan's own tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - id: plan
        run: python3 tools/ci.py plan --event ${{ github.event_name }}

  test-ubuntu:
    name: test
    needs: plan
    if: needs.plan.outputs.any == 'true'
    uses: ./.github/workflows/python-tests.yml
    with:
      matrix: ${{ needs.plan.outputs.linux }}

  test-windows:
    name: test
    needs: plan
    if: needs.plan.outputs.any == 'true'
    uses: ./.github/workflows/python-tests.yml
    with:
      matrix: ${{ needs.plan.outputs.windows }}

  # Nightly and manual runs only, the newest Python.  Not required: it has no `required`
  # job (macOS runners can queue for a long time).
  test-macos:
    name: test
    needs: plan
    if: needs.plan.outputs.any_macos == 'true'
    uses: ./.github/workflows/python-tests.yml
    with:
      matrix: ${{ needs.plan.outputs.macos }}

  build:
    name: build ${{ matrix.package }}
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyproject.toml's version, and __version__, must be the one CHANGELOG.md's top
      # version section names; then ruff, and mypy where the package type checks, at the
      # pins of the packages' dev extras (bump them together).
      - name: Version, lint, type check
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ruff==0.17.2" "mypy==2.4.0"
          python tools/ci.py build-check ${{ matrix.package }}
      - name: Build distributions
        working-directory: python/${{ matrix.package }}
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: python/${{ matrix.package }}/dist/

  required-ubuntu:
    name: required (ubuntu, build)
    needs: [plan, test-ubuntu, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every ubuntu leg and build passed or was left out
        env:
          RESULTS: ${{ needs.plan.result }} ${{ needs.test-ubuntu.result }} ${{ needs.build.result }}
        run: |
          echo "plan, test (ubuntu), build: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done

  required-windows:
    name: required (windows)
    needs: [plan, test-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every windows leg passed or was left out
        env:
          RESULTS: ${{ needs.plan.result }} ${{ needs.test-windows.result }}
        run: |
          echo "plan, test (windows): $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
