name: The gates' reference
description: >-
  Python 3.12 and docx-agent (pure Python, not ooxml-core: DOCX_AGENT_RUST=0 too) with what it
  runs, as the differential jobs run it.  The reference cache's key (tools/gates.py cache-key)
  covers the installed distributions, so gates.yml's plan job, which looks the key up, and its
  differential jobs install through this one action.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install ./python/ooxml-common ./python/ooxml-edit "./python/docx2svg[measure]" markdown-it-py mdit-py-plugins
        python -m pip install --no-deps ./python/docx-agent
